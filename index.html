<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遠城寺式発達検査 DQ計算</title>
<style>
  :root { --bg:#f5f7fa; --card:#fff; --text:#1f2933; --sub:#617080; --line:#d9e0e8; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14181d; --card:#1d232a; --text:#e6ebf0; --sub:#93a1b0; --line:#323b45; --accent:#58a6ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--text);
         font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.5; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.2rem; margin:0 0 12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:grid; grid-template-columns:5.5em 1fr 1fr 4.5em; gap:8px; align-items:center; padding:6px 0; }
  .row + .row { border-top:1px solid var(--line); }
  .row.head { color:var(--sub); font-size:.8rem; padding-top:0; }
  .row label { font-weight:600; }
  input[type=number], input[type=date] { width:100%; padding:8px; font-size:1rem; border:1px solid var(--line);
         border-radius:8px; background:var(--bg); color:var(--text); }
  .unit { color:var(--sub); font-size:.85rem; margin-left:2px; }
  .cell { display:flex; align-items:center; }
  .mon, .idq { text-align:right; color:var(--sub); font-variant-numeric:tabular-nums; }
  .result { text-align:center; }
  .dq { font-size:2.8rem; font-weight:700; color:var(--accent); font-variant-numeric:tabular-nums; }
  .detail { color:var(--sub); font-size:.9rem; }
  .err { color:#d1242f; font-size:.9rem; min-height:1.2em; }
  button { padding:8px 14px; font-size:.9rem; border:1px solid var(--line); border-radius:8px;
           background:var(--card); color:var(--text); cursor:pointer; }
  details summary { cursor:pointer; font-weight:600; }
  .dates { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
  .dates span { font-size:.8rem; color:var(--sub); display:block; }
  textarea { width:100%; padding:10px; font-size:1rem; border:1px solid var(--line); border-radius:8px;
         background:var(--bg); color:var(--text); font-family:inherit; resize:vertical; }
  .perr { color:#d1242f; font-size:.85rem; min-height:1.2em; margin-top:4px; }
  h2 { font-size:.95rem; margin:0 0 8px; }
  @media (max-width:420px) {
    body { padding:12px; }
    .row { grid-template-columns:4.6em 1fr 1fr 3.8em; gap:6px; font-size:.9rem; }
    .row label { font-size:.82rem; }
    .unit { font-size:.75rem; }
    input[type=number] { padding:8px 4px; }
    .dq { font-size:2.4rem; }
  }
  .note { color:var(--sub); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>遠城寺式発達検査 DQ計算</h1>

  <div class="card">
    <details>
      <summary>生年月日・検査日から暦年齢を算出（任意）</summary>
      <div class="dates">
        <div><span>生年月日</span><input type="date" id="birth"></div>
        <div><span>検査日</span><input type="date" id="test"></div>
      </div>
    </details>
  </div>

  <div class="card">
    <h2>一括入力</h2>
    <textarea id="bulk" rows="3" placeholder="CA3-9、移動2-10、手2-4、習慣2-6、対人2-0、発語2-8、理解2-6" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
    <div class="perr" id="perr"></div>
  </div>

  <div class="card">
    <div class="row head"><span>項目</span><span>歳</span><span>ヶ月</span><span style="text-align:right">月齢</span></div>
    <div id="rows"></div>
  </div>

  <div class="card result">
    <div class="detail">DQ</div>
    <div class="dq" id="dq">—</div>
    <div class="detail" id="detail"></div>
    <div class="err" id="err"></div>
    <button type="button" id="reset">リセット</button>
  </div>

  <p class="note">DQ = (6領域の発達年齢（月）の平均) ÷ 暦年齢（月）× 100。領域: 移動運動・手の運動・基本的習慣・対人関係・発語・言語理解。</p>
</main>

<script>
const ITEMS = [
  {id:'ca',  label:'CA（暦年齢）'},
  {id:'mv',  label:'移動運動'},
  {id:'hand',label:'手の運動'},
  {id:'hab', label:'基本的習慣'},
  {id:'soc', label:'対人関係'},
  {id:'sp',  label:'発語'},
  {id:'cmp', label:'言語理解'},
];
const rows = document.getElementById('rows');
ITEMS.forEach(it => {
  const d = document.createElement('div');
  d.className = 'row';
  d.innerHTML =
    `<label for="${it.id}-y">${it.label}</label>
     <div class="cell"><input type="number" inputmode="numeric" min="0" max="20" step="1" id="${it.id}-y"><span class="unit">歳</span></div>
     <div class="cell"><input type="number" inputmode="numeric" min="0" max="11" step="1" id="${it.id}-m"><span class="unit">ヶ月</span></div>
     <div class="mon" id="${it.id}-t">—</div>`;
  rows.appendChild(d);
});

const val = (id) => {
  const y = document.getElementById(id + '-y').value;
  const m = document.getElementById(id + '-m').value;
  if (y === '' && m === '') return null;
  const yy = Number(y || 0), mm = Number(m || 0);
  if (!Number.isInteger(yy) || !Number.isInteger(mm) || yy < 0 || mm < 0 || mm > 11) return NaN;
  return yy * 12 + mm;
};

function calc() {
  const err = document.getElementById('err');
  const vals = ITEMS.map(it => val(it.id));
  ITEMS.forEach((it, i) => {
    document.getElementById(it.id + '-t').textContent =
      (vals[i] === null || Number.isNaN(vals[i])) ? '—' : vals[i] + 'ヶ月';
  });
  const dqEl = document.getElementById('dq'), detail = document.getElementById('detail');
  dqEl.textContent = '—'; detail.textContent = ''; err.textContent = '';

  if (vals.some(Number.isNaN)) { err.textContent = 'ヶ月は0〜11の整数で入力'; return; }
  if (vals.some(v => v === null)) return;
  const ca = vals[0];
  if (ca <= 0) { err.textContent = '暦年齢は1ヶ月以上で入力'; return; }
  const sum = vals.slice(1).reduce((a, b) => a + b, 0);
  const mean = sum / 6;
  const dq = mean / ca * 100;
  dqEl.textContent = dq.toFixed(1);
  detail.textContent = `発達年齢合計 ${sum}ヶ月 ÷ 6 = ${mean.toFixed(2)}ヶ月（${Math.floor(mean/12)}歳${(mean%12).toFixed(1)}ヶ月）／ CA ${ca}ヶ月`;
}

function fromDates() {
  const b = document.getElementById('birth').value, t = document.getElementById('test').value;
  if (!b || !t) return;
  const [by, bm, bd] = b.split('-').map(Number), [ty, tm, td] = t.split('-').map(Number);
  let months = (ty - by) * 12 + (tm - bm);
  if (td < bd) months--;
  if (months < 0) { document.getElementById('err').textContent = '検査日が生年月日より前'; return; }
  document.getElementById('ca-y').value = Math.floor(months / 12);
  document.getElementById('ca-m').value = months % 12;
  calc();
}

const KEYS = [
  ['ca',  ['CA','暦年齢','暦年令']],
  ['mv',  ['移動運動','移動']],
  ['hand',['手の運動','手']],
  ['hab', ['基本的習慣','習慣']],
  ['soc', ['対人関係','対人']],
  ['sp',  ['発語']],
  ['cmp', ['言語理解','理解']],
];
const SHORT = {ca:'CA', mv:'移動', hand:'手', hab:'習慣', soc:'対人', sp:'発語', cmp:'理解'};
const norm = (t) => t
  .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[Ａ-Ｚａ-ｚ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
  .replace(/[－‐‑–—―−ー~〜]/g, '-');

function parseBulk() {
  const perr = document.getElementById('perr');
  perr.textContent = '';
  const t = norm(document.getElementById('bulk').value);
  if (!t.trim()) return;
  const names = KEYS.flatMap(([id, ns]) => ns.map(n => [n, id])).sort((a, b) => b[0].length - a[0].length);
  const re = new RegExp('(' + names.map(n => n[0]).join('|') + ')\\s*[:：=]?\\s*(\\d+)\\s*-\\s*(\\d+)', 'gi');
  const found = {}, bad = [];
  let m;
  while ((m = re.exec(t)) !== null) {
    const id = names.find(n => n[0].toLowerCase() === m[1].toLowerCase())[1];
    const y = Number(m[2]), mo = Number(m[3]);
    if (mo > 11) bad.push(`${SHORT[id]}: ヶ月は0〜11`);
    found[id] = [y, mo];
  }
  KEYS.forEach(([id]) => {
    if (found[id]) {
      document.getElementById(id + '-y').value = found[id][0];
      document.getElementById(id + '-m').value = found[id][1];
    }
  });
  const missing = KEYS.filter(([id]) => !found[id]).map(([id]) => SHORT[id]);
  const msgs = [...bad];
  if (missing.length) msgs.push('未入力: ' + missing.join('・'));
  perr.textContent = msgs.join(' / ');
  calc();
}

function writeBulk() {
  const parts = ITEMS.map(it => {
    const y = document.getElementById(it.id + '-y').value, m = document.getElementById(it.id + '-m').value;
    return (y === '' && m === '') ? null : `${SHORT[it.id]}${y || 0}-${m || 0}`;
  });
  document.getElementById('bulk').value = parts.every(p => p) ? parts.join('、') : '';
  document.getElementById('perr').textContent = '';
}

document.addEventListener('input', e => {
  if (e.target.id === 'bulk') parseBulk();
  else {
    if (e.target.id === 'birth' || e.target.id === 'test') fromDates(); else calc();
    writeBulk();
  }
});
document.getElementById('reset').addEventListener('click', () => {
  document.querySelectorAll('input, textarea').forEach(i => i.value = '');
  document.getElementById('perr').textContent = '';
  calc();
});
calc();
</script>
</body>
</html>
